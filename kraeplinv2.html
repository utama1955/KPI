<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c5364">
    <!-- Dukungan PWA khusus untuk iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tes Kraepelin">
    <link rel="apple-touch-icon" href="logoku.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sistem Tes Kraepelin - Toko Cat Utama</title>
    <style>
        :root {
            --utama-blue: #2c5364;
            --utama-yellow: #f39c12;
            --utama-red: #e74c3c;
            --bg-color: #000000;
            --card-bg: #ffffff;
            --text-dark: #1f2933;
            --muted: #64748b;
            --line: #dbe6eb;
            --soft-bg: #f1f4f6;
            --success: #27ae60;
            --icon-color: #222;
        }

        /* Page layout */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000000;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; /* Diubah agar tinggi selalu pas dengan layar yang terlihat di HP */
            overflow: hidden; /* Mengunci konten agar tidak bisa digulir sama sekali */
            overscroll-behavior: none; /* Mencegah efek membal (bouncing/pull-to-refresh) di browser HP */
            padding: 15px;
            box-sizing: border-box;
        }

        .hr-app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.12);
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
            padding: 6px;
            color: var(--icon-color);
        }
        .fullscreen-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.16); }
        .fullscreen-btn:active { transform: translateY(0); }

        .fullscreen-btn svg { width: 22px; height: 22px; display: block; }
        .fullscreen-btn svg path {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Logo frame */
        .logo-frame {
            background: var(--soft-bg);
            border-radius: 8px;
            padding: 10px 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }
        .logo-header img {
            max-width: 320px;
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Countdown overlay */
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .countdown-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .countdown-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .countdown-number {
            font-size: 140px;
            font-weight: 900;
            color: var(--utama-blue);
            line-height: 1;
            text-shadow: 2px 5px 15px rgba(44, 83, 100, 0.22);
        }

        /* Components */
        .progress-container {
            width: 100%;
            height: 12px;
            background: var(--soft-bg);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid var(--line);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2c5364, #27ae60);
            transition: width 0.4s ease;
        }

        .total-timer-box {
            background: var(--soft-bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid var(--utama-blue);
            margin-bottom: 25px;
        }
        .label-sm {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }
        .timer-main {
            font-size: 56px;
            font-weight: 800;
            color: var(--utama-blue);
            font-family: 'Courier New', Courier, monospace;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border: 1px solid var(--line);
            padding: 20px;
            border-radius: 8px;
        }
        .stat-card strong {
            font-size: 38px;
            display: block;
            margin: 5px 0;
            color: var(--text-dark);
        }
        .target-info {
            font-size: 13px;
            color: var(--utama-red);
            font-weight: 600;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-start { background: var(--success); color: white; }
        .btn-pause { background: var(--utama-yellow); color: white; }
        .btn-lap { background: var(--utama-blue); color: white; }
        .btn-reset { background: #6c757d; color: white; }

        .flash { animation: flash-animation 0.5s; }
        @keyframes flash-animation {
            0% { background-color: white; }
            50% { background-color: #e8f6ef; }
            100% { background-color: white; }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .hr-app-container { padding: 20px 15px; border-radius: 15px; }
            .logo-header img { max-width: 220px; }
            .timer-main { font-size: 42px; }
            .stats-grid { gap: 10px; }
            .stat-card { padding: 15px 10px; }
            .stat-card strong { font-size: 26px; }
            button { padding: 15px 10px; font-size: 14px; }
            .label-sm { font-size: 10px; }
            .countdown-text { font-size: 18px; }
            .countdown-number { font-size: 100px; }
            .fullscreen-btn { width: 40px; height: 40px; top: 10px; right: 10px; }
            .logo-frame { padding: 8px 10px; }
        }
    </style>
</head>
<body>

<div class="hr-app-container" id="mainApp">
    <button class="fullscreen-btn" id="btnFullscreenIcon" onclick="toggleFullscreen()" title="Buka Layar Penuh" aria-label="Buka Layar Penuh" aria-pressed="false">
        <svg id="fullscreenIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M3 9V5a2 2 0 0 1 2-2h4" />
            <path d="M21 15v4a2 2 0 0 1-2 2h-4" />
            <path d="M9 21H5a2 2 0 0 1-2-2v-4" />
            <path d="M15 3h4a2 2 0 0 1 2 2v4" />
        </svg>
    </button>

    <div class="countdown-overlay" id="countdownOverlay">
        <div class="countdown-text" id="countdownText">Persiapan</div>
        <div class="countdown-number" id="countdownNumber"></div>
    </div>

    <div class="hr-inner">
        <div class="logo-header">
            <div class="logo-frame">
                <img src="Banner Utama.png" alt="Logo Toko Cat Utama" />
            </div>
        </div>

        <div class="label-sm">Progress Tes Kraepelin</div>
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="total-timer-box">
            <span class="label-sm">Waktu Keseluruhan</span>
            <div class="timer-main" id="totalTime">00:00:00</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card" id="lapCard">
                <span class="label-sm">Lap</span>
                <strong id="displayLap">1 / 50</strong>
            </div>
            <div class="stat-card" id="timerCard">
                <span class="label-sm">Waktu Lap</span>
                <strong id="displayLapTimer">00:00</strong>
                <span class="target-info" id="displayTarget">Target: 13.5s</span>
            </div>
        </div>

        <div class="button-grid">
            <button class="btn-start" id="btnStart" onclick="startTes()">Start</button>
            <button class="btn-pause" id="btnPause" onclick="pauseTes()" disabled>Jeda</button>
            <button class="btn-lap" id="btnLap" onclick="manualNext()" disabled>Lap</button>
            <button class="btn-reset" id="btnReset" onclick="resetTes()">Reset</button>
        </div>
        <div style="margin-top: 20px; font-size: 10px; color: var(--muted); letter-spacing: 0.5px;">
            powered by Baha
        </div>
    </div>
</div>

<script>
    // Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
        });
    }
    
    // --- DAFTAR FILE SUARA (AUDIO) ---
    const audioFiles = {
        'persiapan': new Audio('persiapan.mp3'),
        '3': new Audio('tiga.mp3'),
        '2': new Audio('dua.mp3'),
        '1': new Audio('satu.mp3'),
        'mulai': new Audio('mulai.mp3'),
        'pindah': new Audio('pindah.mp3'),
        'selesai': new Audio('selesai.mp3')
    };

    // --- Preload semua audio agar tidak delay saat diputar ---
    Object.values(audioFiles).forEach(audio => {
        audio.preload = 'auto';
        audio.load();
    });

    // Fungsi untuk memutar audio berdasarkan kunci
    function mainkanSuara(key) {
        if (audioFiles[key]) {
            audioFiles[key].currentTime = 0; // Riset ke awal jika audio diputar berulang
            audioFiles[key].play().catch(e => {
                console.warn('Gagal memutar audio:', key, e);
            });
        }
    }

    // --- Kraepelin logic ---
    const totalLaps = 50;
    function getDuration(lap) {
        return 13500; // Durasi seragam 13,5 detik
    }

    let timerRef;
    let isRunning = false;
    let isCountingDown = false;
    let startTime, elapsedTime = 0;
    let lapStartTime = 0;
    let currentLap = 1;
    let currentTarget = getDuration(1);

    function startTes() {
        if (!isRunning && !isCountingDown) {
            // Panggil fungsi pencegah layar mati di sini
            aktifkanWakeLock(); 

            if (elapsedTime === 0 && currentLap === 1) {
                mulaiHitunganMundur();
            } else {
                jalankanTimer();
            }
        }
    }

    function mulaiHitunganMundur() {
        isCountingDown = true;
        toggleButtons(true);

        const overlay = document.getElementById('countdownOverlay');
        const textEl = document.getElementById('countdownText');
        const numEl = document.getElementById('countdownNumber');

        overlay.classList.add('active');
        textEl.innerText = "Persiapkan diri Anda";
        numEl.innerText = "";

        // Putar Suara Persiapan
        mainkanSuara('persiapan');

        setTimeout(() => {
            let hitung = 3;
            textEl.innerText = "";
            const intervalHitung = setInterval(() => {
                if (hitung > 0) {
                    numEl.innerText = hitung;
                    // Putar Suara Hitungan (3, 2, 1)
                    mainkanSuara(String(hitung));
                    hitung--;
                } else {
                    clearInterval(intervalHitung);
                    numEl.style.fontSize = window.innerWidth <= 500 ? "60px" : "80px";
                    numEl.innerText = "MULAI!";
                    // Putar Suara Mulai
                    mainkanSuara('mulai');
                    setTimeout(() => {
                        overlay.classList.remove('active');
                        isCountingDown = false;
                        numEl.style.fontSize = "";
                        jalankanTimer();
                    }, 800);
                }
            }, 1000);
        }, 2000);
    }

    function jalankanTimer() {
        isRunning = true;
        startTime = Date.now() - elapsedTime;
        timerRef = setInterval(tick, 10);
        toggleButtons(true);
    }

    function pauseTes() {
        if (isCountingDown) return;
        isRunning = false;
        clearInterval(timerRef);
        elapsedTime = Date.now() - startTime;
        toggleButtons(false);
    }

    function tick() {
        const now = Date.now();
        const totalMs = now - startTime;
        const lapMs = totalMs - lapStartTime;

        document.getElementById('totalTime').innerText = formatTime(totalMs);
        document.getElementById('displayLapTimer').innerText = formatTimeSimple(lapMs);

        if (lapMs >= currentTarget) {
            nextLap(totalMs);
        }
    }

    function nextLap(currentTime) {
        if (currentLap >= totalLaps) {
            finishTes();
            return;
        }

        // Efek getar saat pindah lap diletakkan di sini
        if ('vibrate' in navigator) navigator.vibrate(200);

        currentLap++;
        lapStartTime = currentTime;
        currentTarget = getDuration(currentLap);

        document.getElementById('displayLap').innerText = `${currentLap} / ${totalLaps}`;
        document.getElementById('displayTarget').innerText = `Target: ${(currentTarget/1000).toFixed(1)}s`;

        const progress = (currentLap / totalLaps) * 100;
        document.getElementById('progressBar').style.width = progress + "%";

        const lapCard = document.getElementById('lapCard');
        lapCard.classList.add('flash');
        setTimeout(() => lapCard.classList.remove('flash'), 500);

        // Putar Suara Pindah/Berikutnya
        mainkanSuara('pindah');
    }

    function manualNext() {
        if (isRunning && !isCountingDown) nextLap(Date.now() - startTime);
    }

    function finishTes() {
        isRunning = false;
        clearInterval(timerRef);
        
        // Cek dulu apakah browser mendukung fitur getar
        if ('vibrate' in navigator) navigator.vibrate([500, 200, 500]);
        
        // Putar Suara Selesai
        mainkanSuara('selesai');

        // Ubah tampilan visual
        const timerMain = document.getElementById('totalTime');
        timerMain.style.color = 'var(--success)'; // Berubah jadi hijau
        document.getElementById('displayLapTimer').innerText = "SELESAI";
        
        toggleButtons(false);
        document.getElementById('btnStart').disabled = true;
    }

    function resetTes() {
        location.reload();
    }

    function formatTime(ms) {
        const d = new Date(ms);
        const m = String(d.getUTCMinutes()).padStart(2, '0');
        const s = String(d.getUTCSeconds()).padStart(2, '0');
        const ms_val = String(Math.floor(d.getUTCMilliseconds() / 10)).padStart(2, '0');
        return `${m}:${s}:${ms_val}`;
    }

    function formatTimeSimple(ms) {
        const d = new Date(ms);
        const s = String(d.getUTCSeconds()).padStart(2, '0');
        const ms_val = String(Math.floor(d.getUTCMilliseconds() / 10)).padStart(2, '0');
        return `${s}:${ms_val}`;
    }

    function toggleButtons(running) {
        document.getElementById('btnStart').disabled = running;
        document.getElementById('btnPause').disabled = !running;
        document.getElementById('btnLap').disabled = !running;
    }

    // --- Fullscreen helpers ---
    function toggleFullscreen() {
        const elem = document.documentElement;
        if (!document.fullscreenElement) {
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    }

    function updateFullscreenIcon() {
        const svg = document.getElementById('fullscreenIcon');
        const btn = document.getElementById('btnFullscreenIcon');
        const inFullscreen = !!document.fullscreenElement;
        btn.setAttribute('aria-pressed', String(inFullscreen));
        if (inFullscreen) {
            svg.innerHTML = `
                <path d="M9 3H5a2 2 0 0 0-2 2v4"/>
                <path d="M21 15v4a2 2 0 0 1-2 2h-4"/>
                <path d="M15 21h4a2 2 0 0 0 2-2v-4"/>
                <path d="M3 9V5a2 2 0 0 1 2-2h4"/>
            `;
        } else {
            svg.innerHTML = `
                <path d="M3 9V5a2 2 0 0 1 2-2h4"/>
                <path d="M21 15v4a2 2 0 0 1-2 2h-4"/>
                <path d="M9 21H5a2 2 0 0 1-2-2v-4"/>
                <path d="M15 3h4a2 2 0 0 1 2 2v4"/>
            `;
        }
    }
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    updateFullscreenIcon();

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (isRunning) pauseTes();
            else startTes();
        }
        if (e.code === 'KeyL') manualNext();
    });

    // konfirmasi saat keluar
    window.addEventListener('beforeunload', function (e) {
    if (isRunning || isCountingDown) {
        e.preventDefault();
        e.returnValue = ''; // Memunculkan pop-up peringatan bawaan browser
    }
    });

    // --- Fitur Mencegah Layar Mati (Wake Lock) ---
    let wakeLock = null;

    async function aktifkanWakeLock() {
        try {
            // Periksa apakah browser mendukung fitur Wake Lock
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('Wake Lock aktif: Layar tidak akan meredup.');

                // Jika fitur dilepas (misal karena baterai lemah), log peringatan
                wakeLock.addEventListener('release', () => {
                    console.log('Wake Lock dilepas.');
                });
            } else {
                console.log('Browser tidak mendukung fitur Wake Lock.');
            }
        } catch (err) {
            console.error(`Gagal mengaktifkan Wake Lock: ${err.name}, ${err.message}`);
        }
    }

    // Pastikan Wake Lock aktif kembali jika user berpindah aplikasi lalu kembali lagi
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await aktifkanWakeLock();
        }
    });
    
</script>
</body>
</html>
